<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Coding Academy</title>
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <button class="menu-toggle-btn" onclick="app.toggleSidebar()">☰</button>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="app.toggleSidebar()"></div>

    <div class="app-container">
        <aside class="sidebar glass" id="sidebar">
            <div class="logo"><h2>🚀 CodeAcademy</h2></div>
            <nav class="nav-menu">
                <button onclick="app.navigate('dashboard'); app.toggleSidebar()" class="nav-btn active" id="nav-dashboard">📊 Dashboard Utama</button>
                
                <p class="nav-label">LEARNING PATHS</p>
                <button onclick="app.navigate('web-dev'); app.toggleSidebar()" class="nav-btn" id="nav-web-dev">🌐 Web Development</button>
                <button onclick="app.navigate('app-dev'); app.toggleSidebar()" class="nav-btn" id="nav-app-dev">📱 App Development</button>
                
                <p class="nav-label">RESOURCES</p>
                <button onclick="app.navigate('roadmap'); app.toggleSidebar()" class="nav-btn" id="nav-roadmap">🗺️ Roadmap</button>
                <!-- MENU PROJECTS YANG DIUPDATE -->
                <button onclick="app.navigate('projects'); app.toggleSidebar()" class="nav-btn" id="nav-projects">💻 Projects</button>
                <button onclick="app.navigate('bookmarks'); app.toggleSidebar()" class="nav-btn" id="nav-bookmarks">⭐ Bookmarks</button>
                <button onclick="app.navigate('notes'); app.toggleSidebar()" class="nav-btn" id="nav-notes">📝 My Notes</button>
                <button onclick="app.navigate('achievements'); app.toggleSidebar()" class="nav-btn" id="nav-achievements">🏆 Achievements</button>
            </nav>
            <div class="theme-toggle"><button onclick="app.toggleTheme()">🌓 Toggle Theme</button></div>
        </aside>

        <main class="main-content" id="main-content"></main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="storage.js"></script>
    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
